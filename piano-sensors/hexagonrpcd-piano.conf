# Xiaomi Pad 8 Pro: sensors PD on the secure ADSP fastrpc node, inputs
# imported by piano-sensors-import, registry written into its persist copy.
[Unit]
Requires=piano-sensors-import.service
After=piano-sensors-import.service piano-adsp.service
Before=iio-sensor-proxy.service

[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-adsp-secure
Environment=hexagonrpcd_dsp=adsp
Environment=hexagonrpcd_fw_dir=/var/lib/piano-sensors
Environment=HEXAGONRPC_PERSIST_DIR=/var/lib/piano-sensors/persist/sensors
ReadWritePaths=/var/lib/piano-sensors/persist/sensors
# fastrpc is kept off the automatic module loading list on piano; load it
# once the ADSP runs and wait for its device node.
ExecStartPre=+/usr/sbin/modprobe fastrpc
ExecStartPre=+/bin/sh -c 'for i in $$(seq 60); do [ -e /dev/fastrpc-adsp-secure ] && exit 0; sleep 1; done; exit 1'
Restart=on-failure
RestartSec=5
